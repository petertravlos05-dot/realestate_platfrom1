name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  backend-security:
    name: Backend Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run dependency audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Type check
        working-directory: ./backend
        run: npm run type-check

      - name: Validate environment variables
        working-directory: ./backend
        run: npm run validate-env
        env:
          JWT_SECRET: test-secret-minimum-32-characters-long-for-validation
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  frontend-security:
    name: Frontend Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: listings/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./listings/frontend
        run: npm ci

      - name: Run dependency audit
        working-directory: ./listings/frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Type check
        working-directory: ./listings/frontend
        run: npm run type-check

      - name: Lint
        working-directory: ./listings/frontend
        run: npm run lint
        continue-on-error: true





